<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} | find-news {{ pref_name }}</title>
<link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
<header class="site">
  <a class="title" href="{{ root }}index.html">find-news 要検証シグナル({{ pref_name }})</a>
  <nav aria-label="サイト内">
    <a href="{{ root }}index.html"{% if page == 'index.html' %} aria-current="page"{% endif %}>概要</a>
    {% if groups %}<a href="{{ root }}matrix/{{ groups[0].id }}.html"{% if page.startswith('matrix/') %} aria-current="page"{% endif %}>マトリックス</a>{% endif %}
    <a href="{{ root }}events.html"{% if page == 'events.html' %} aria-current="page"{% endif %}>イベント</a>
    <a href="{{ root }}sources.html"{% if page == 'sources.html' %} aria-current="page"{% endif %}>データソース</a>
    <a href="{{ root }}about.html"{% if page == 'about.html' %} aria-current="page"{% endif %}>方法と用語</a>
  </nav>
</header>
<main>
{% block body %}{% endblock %}
</main>
<footer class="site">
  公開資料から機械的に作成した要検証シグナルの一覧。掲載は個人・団体の不正や意図を示すものではない。生成日 {{ generated }}。
  方向の閾値 ±{{ '%.1f'|format(threshold * 100) }}%(増加=青、減少=赤、横ばい・未取得=灰。文字でも併記)。
</footer>
<script src="{{ root }}static/site.js"></script>
</body>
</html>
