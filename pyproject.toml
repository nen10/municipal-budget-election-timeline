[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "findnews"
version = "0.1.0"
description = "補助金圧力検出システム(要検証シグナルの抽出)第1フェーズ: 栃木県パイロット"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdf>=4"]

[project.scripts]
findnews = "findnews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
findnews = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
