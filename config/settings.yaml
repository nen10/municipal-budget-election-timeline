# 検証(DESIGN.md 第10節)とマトリックス(第11節)の設定。
verification:
  period: [2021, 2026]          # 対象年度(西暦の会計年度)
  direction_threshold: 0.05     # 増減方向の閾値: +5% 以上=増加、-5% 以下=減少、その間=横ばい
  pre_years: [2023, 2024, 2025] # 選挙前の平均をとる年度
  post_year: 2026               # 選挙後の年度(指標 4, 5)
  post_year_tokko: 2025         # 選挙後の年度(指標 3 = その年度の 3 月分)
